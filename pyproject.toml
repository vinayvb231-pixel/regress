[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "regress-ai"
version = "0.1.1"
description = "Dead-simple regression testing for LLM prompts, built for CI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["pyyaml>=6"]
keywords = ["llm", "evals", "testing", "ci", "prompts"]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["openai>=1.0", "anthropic>=0.30"]

[project.scripts]
regress = "regress.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["regress*"]
